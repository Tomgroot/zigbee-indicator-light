<text x="480" y="640" text-anchor="start" font-size="12" fill="#111" stroke="none">IO8 / IO15 pull-ups keep these strapping pins from floating.</text>
<text x="480" y="660" text-anchor="start" font-size="12" fill="#111" stroke="none">Short the TP1 pads while plugging in USB = flash mode.</text>
<text x="480" y="677" text-anchor="start" font-size="12" fill="#111" stroke="none">Plug in 5 times in a row = Zigbee factory reset (firmware).</text>
<text x="30" y="830" text-anchor="start" font-size="13" fill="#111" stroke="none">Same net name = same wire (VBUS, 3V3, VLED, USB_D+, USB_D-, IO14). All ground symbols are connected.</text>
